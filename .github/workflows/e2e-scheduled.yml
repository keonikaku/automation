name: E2E (on demand)

# The live end-to-end run: the real Playwright suite against the real
# automationexercise.com.
#
# It runs when a person asks for it, never on a schedule and never on a pull
# request, and it is reported rather than gated. The target is a third-party practice site that serves
# interstitial ads and periodically goes down. Wiring a pull-request gate, or
# a public badge: to it would produce red for reasons that have nothing to do
# with this repository, and a badge nobody trusts is worse than no badge.
#
# What this job does NOT do: hide failures. There is no continue-on-error
# anywhere in it. When a test genuinely breaks, this workflow goes red, and
# that red is visible in the Actions tab of this repository.
#
# See docs/quality-gates.md.

# Manual dispatch only. The schedule was removed on 2026-07-30: a nightly cron
# makes this suite look like something a robot keeps alive, and the one thing
# this repository exists to show is that a person built it and runs it. A run
# history in which every entry was triggered by hand is the better artifact. It
# also stops the practice site producing 3am red for reasons no commit here
# controls.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-scheduled
  cancel-in-progress: false

jobs:
  web-e2e:
    name: Web E2E against automationexercise.com
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      # Headless by default: nothing here sets HEADED. Video recording is on,
      # which is the point: the artifact below is produced by the same code
      # path that produces the recordings published on the site.
      #
      # Retries cover genuine third-party flake (an ad overlay, a slow
      # response). They cannot cover a real defect: a broken test fails all
      # three attempts and the job goes red.
      - name: Run the web suite
        run: |
          pytest -m ui \
            --reruns 2 --reruns-delay 5 \
            --html=report.html --self-contained-html

      - name: Upload report and recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-run-${{ github.run_number }}
          path: |
            report.html
            recordings/*.webm
          retention-days: 14
          if-no-files-found: warn

  # Native iOS is excluded from CI by architecture, not by omission.
  #
  # tests/native/test_ios_native.py drives the Sauce Labs demo app through
  # Appium/XCUITest on an iPhone Simulator. That needs a macOS runner with
  # Xcode, a booted simulator and the app installed on it. GitHub-hosted macOS
  # minutes bill at roughly ten times Linux, and the app build is not
  # published, so the job could not be made to work at any price worth paying.
  #
  # It is therefore carried by the `native` marker, which pytest.ini deselects
  # by default. No workflow in this repository ever runs a native test:
  # ci.yml passes `-m native` only to `pytest --collect-only`, to assert the
  # test still exists so the exclusion cannot quietly become an omission.
  #
  # It is run locally and its recording is published. There is no scenario in
  # which a CI run silently skips it and reports green as though it had passed.
