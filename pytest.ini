[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .

# --strict-markers  : a typo in a marker is an error, not a silent no-op.
# --strict-config   : a typo in this file is an error too.
# -m "not native"   : the Appium iOS test needs macOS, Xcode, a booted
#                     Simulator and a running Appium server. Deselecting it by
#                     default is what makes a clean clone run with
#                     `pip install -r requirements.txt && pytest`.
#                     Opt back in with `pytest -m native`.
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not native"

markers =
    unit: deterministic checks: no network, no browser. Gates every pull request.
    ui: Playwright web tests against the live practice site. Scheduled, not gated.
    native: Appium iOS on a local Simulator. Never runs in CI, by design.
